# Static site published from the repo root; checkout server code lives in Netlify Functions.
[build]
  publish = "."
  # Fails the deploy if a product-page price was edited without re-syncing the
  # checkout catalog (run: node scripts/sync-catalog.mjs).
  command = "node scripts/sync-catalog.mjs --check"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The repo root is the publish dir, so keep server/tooling files from being served.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
